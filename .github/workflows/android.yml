name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
      - run: chmod +x ./gradlew
      - name: Core tests
        run: ./gradlew :core:test --no-daemon
      - name: Build debug APK
        env:
          LUFOP_API_KEY: ${{ secrets.LUFOP_API_KEY }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - run: mkdir -p out && cp app/build/outputs/apk/debug/app-debug.apk out/CamRadar-debug.apk
      - uses: actions/upload-artifact@v4
        with: { name: CamRadar-debug-apk, path: out/CamRadar-debug.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: debug
          name: Latest debug build
          prerelease: true
          files: out/CamRadar-debug.apk
